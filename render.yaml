services:
  # 1. Python AI Microservice (PM4Py, SimPy, scikit-learn)
  - type: web
    name: cn-ai-service
    runtime: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app --workers 2 --timeout 120
    plan: free

  # 2. Node.js Express Backend API
  - type: web
    name: cn-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        value: mongodb+srv://mb9618951_db_user:ma%402110sa@cluster0.z3np1k0.mongodb.net/hospital_accreditation?retryWrites=true&w=majority
      - key: JWT_SECRET
        generateValue: true
      - key: PY_SERVICE_URL
        fromService:
          type: web
          name: cn-ai-service
          property: host

  # 3. React Frontend Web Application (Static Site)
  - type: web
    name: cn-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
