services:
  # 1. Node.js Backend API Service
  - type: web
    name: cn-hospital-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        value: mongodb+srv://mb9618951_db_user:ma%402110sa@cluster0.z3np1k0.mongodb.net/hospital_accreditation?retryWrites=true&w=majority
      - key: JWT_SECRET
        generateValue: true
      - key: PY_SERVICE_URL
        fromService:
          type: web
          name: cn-hospital-ai
          property: host

  # 2. Python AI Microservice (PM4Py, SimPy, Scikit-Learn)
  - type: web
    name: cn-hospital-ai
    env: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.9
